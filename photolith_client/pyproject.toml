[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "photolith-client"
dynamic = ["version"]
description = "Client for the Photolith API"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["requests>=2.25"]

[tool.setuptools.dynamic]
version = {attr = "photolith_client.__version__"}
